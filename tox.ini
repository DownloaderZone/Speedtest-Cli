[tox]
skipsdist=true
envlist = py38,py39,py310,py311,py312,py313,py314,flake8

[testenv]
commands =
    {envpython} -V
    {envpython} -m compileall speedtest.py
    {envpython} speedtest.py --version
    {envpython} speedtest.py --help
    {envpython} -m unittest discover tests

[testenv:flake8]
basepython=python
deps=flake8
commands =
    {envpython} -V
    flake8 speedtest.py

[testenv:pypy]
commands =
    pypy -V
    pypy -m compileall speedtest.py
    pypy speedtest.py --version
    pypy speedtest.py --help
    pypy -m unittest discover tests
